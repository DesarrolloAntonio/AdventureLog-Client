appId: com.desarrollodroide.adventurelog.debug
---
- launchApp
- tapOn: "Server URL"
- inputText: "http://192.168.1.27:8016/"
- tapOn: "User"
- inputText: "TestMaestro"
- tapOn: "Password"
- inputText: "AdventureLogDev"
- tapOn:
    text: Login
    index: 1

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Recent adventures"

# Define individual variables instead of a complex object
- evalScript: ${output.locationName = "Lake District Mountain Resort"}
- evalScript: ${output.locationCategory = "Hotel"}
- evalScript: ${output.locationWebsite = "https://lakedistrict-resort.com"}
- evalScript: ${output.locationDescription = "Beautiful mountain resort with scenic views and spa facilities. Perfect for weekend getaways."}
- evalScript: ${output.locationPlace = "Madrid, Spain"}
- evalScript: ${output.locationTag1 = "Spa"}
- evalScript: ${output.locationTag2 = "Swimming"}
- evalScript: ${output.locationTag3 = "Hiking"}
- evalScript: ${output.locationImageUrl = "https://images.unsplash.com/photo-1571896349842-33c89424de2d"}
- evalScript: ${output.locationStartDate = "15/01/2025"}
- evalScript: ${output.locationEndDate = "20/01/2025"}
- evalScript: ${output.locationVisitNotes = "Amazing experience with family"}

- tapOn: Menu
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: MY ADVENTURES
- tapOn: Locations
- assertVisible: Locations

- tapOn: "Add adventure"
- extendedWaitUntil:
    visible: "Basic Information"
    timeout: 5000

# ===== BASIC INFORMATION =====
- tapOn: "Adventure Name"
- inputText: ${output.locationName}

- tapOn: "Category"
- tapOn:
    point: 9%,34%
- tapOn: ${output.locationCategory}

- tapOn:
    point: "50%,25%"
    
- tapOn: "Website Link"
- inputText: ${output.locationWebsite}

- tapOn: "Write your description..."
- inputText: ${output.locationDescription}

- tapOn: "Public Adventure"

# ===== LOCATION INFORMATION =====
- tapOn: "Location Information"
- extendedWaitUntil:
    visible: "Search location"
    timeout: 3000

- tapOn: "Location"
- inputText: ${output.locationPlace}

# ===== TAGS =====
- tapOn:
    text: "Tags"
    
- extendedWaitUntil:
    visible: "Add tag"
    timeout: 3000

- tapOn: "Add tag"
- inputText: ${output.locationTag1}
- tapOn: "+"

- tapOn: "Add tag"
- inputText: ${output.locationTag2}
- tapOn: "+"

- tapOn: "Add tag"
- inputText: ${output.locationTag3}
- tapOn: "+"

# ===== IMAGES =====
- tapOn:
    text: "Images"
    
- extendedWaitUntil:
    visible: "Upload"
    timeout: 3000

- tapOn: "URL"
- extendedWaitUntil:
    visible: "Image URL"
    timeout: 2000

- tapOn: "Image URL"
- inputText: ${output.locationImageUrl}
- tapOn: "Add Image"

# ===== DATE INFORMATION =====
- tapOn: "Date information"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 3000

- tapOn: "All day"

- tapOn:
    text: "dd/mm/yyyy"
    index: 0
- inputText: ${output.locationStartDate}

- tapOn:
    text: "dd/mm/yyyy"
    index: 1
- inputText: ${output.locationEndDate}

- tapOn: "Add notes about this visit"
- inputText: ${output.locationVisitNotes}

- tapOn: "Add"

# ===== SAVE THE ADVENTURE =====
- scrollUntilVisible:
    element: "Save"
    direction: UP
    timeout: 5000

- tapOn: "Save"

# ===== VERIFY IN THE LIST =====
- extendedWaitUntil:
    visible: ${output.locationName}
    timeout: 5000

# ===== ENTER DETAIL AND VERIFY =====
- tapOn: ${output.locationName}

- assertVisible: ${output.locationName}
- assertVisible: ${output.locationDescription}
- assertVisible: ${output.locationPlace}
- assertVisible: ${output.locationTag1}
- assertVisible: ${output.locationTag2}
- assertVisible: ${output.locationTag3}