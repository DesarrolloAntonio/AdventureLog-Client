<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AdventureLog Android edit collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006973}a:hover{color:#004F57}
</style>
</helmet>
<sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #F5FAFB; color: #171D1E; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; box-sizing: border-box">

  <div style="padding: 40px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; height: 48px">
      <button aria-label="Close" style="all: unset; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#171D1E" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <h1 style="margin: 4px 4px 0; font-size: 52px; line-height: 1; font-weight: 800; font-stretch: 38%; letter-spacing: -0.5px">Edit collection</h1>

    <form style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px">
      <section style="border-radius: 24px; background: #FFFFFF; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 38%">Collection</h2>
        <label style="position: relative; display: block">
          <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #3F484A">Collection name</span>
          <span style="height: 56px; border-radius: 14px; border: 1px solid #6F797A; display: flex; align-items: center; padding: 0 14px; box-sizing: border-box"><input value="Cinque Terre" aria-label="Collection name" style="all: unset; flex-grow: 1; font-size: 16px"></span>
        </label>
        <label style="position: relative; display: block">
          <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #3F484A">Description</span>
          <span style="min-height: 96px; border-radius: 14px; border: 1px solid #6F797A; display: block; padding: 16px 14px; box-sizing: border-box; font-size: 16px; line-height: 1.4">Five villages on the Ligurian coast, walked village to village.</span>
        </label>
        <label style="position: relative; display: block">
          <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #3F484A">Link</span>
          <span style="height: 56px; border-radius: 14px; border: 1px solid #6F797A; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#3F484A" stroke-width="2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
            <input placeholder="https://" aria-label="Link" style="all: unset; flex-grow: 1; font-size: 16px">
          </span>
        </label>
      </section>

      <section style="border-radius: 24px; background: #FFFFFF; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 38%">Dates</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="position: relative; display: block">
            <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #3F484A">Start</span>
            <span style="height: 56px; border-radius: 14px; border: 1px solid #6F797A; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#3F484A" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <input value="05/09/2026" aria-label="Start date" style="all: unset; flex-grow: 1; min-width: 0; font-size: 15px">
            </span>
          </label>
          <label style="position: relative; display: block">
            <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #3F484A">End</span>
            <span style="height: 56px; border-radius: 14px; border: 1px solid #6F797A; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#3F484A" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <input value="09/09/2026" aria-label="End date" style="all: unset; flex-grow: 1; min-width: 0; font-size: 15px">
            </span>
          </label>
        </div>
        <label style="display: flex; align-items: center; gap: 14px">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Public</span><span style="font-size: 13px; color: #3F484A">Anyone with the link can view it</span></span>
          <input type="checkbox" role="switch" aria-label="Public" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span aria-hidden="true" style="width: 52px; height: 32px; border-radius: 16px; background: #DEE3E4; border: 2px solid #6F797A; box-sizing: border-box; display: flex; align-items: center; padding-left: 6px"><span style="width: 16px; height: 16px; border-radius: 8px; background: #6F797A"></span></span>
        </label>
      </section>
    </form>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #F5FAFB; border-top: 1px solid #DEE3E4; display: flex; flex-direction: column; gap: 4px">
    <button type="submit" style="all: unset; height: 56px; border-radius: 28px; background: #006973; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">Save changes</button>
    <button type="button" style="all: unset; height: 48px; border-radius: 24px; color: #006973; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">Cancel</button>
  </div>
</div>
</sc-if>
<sc-if value="{{dark}}" hint-placeholder-val="{{ false }}">
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #0E1415; color: #DEE3E4; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; box-sizing: border-box">

        </label>
        <label style="position: relative; display: block">
          <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #1B2122; font-size: 12px; font-weight: 600; color: #BFC8CA">Description</span>
          <span style="min-height: 96px; border-radius: 14px; border: 1px solid #899294; display: block; padding: 16px 14px; box-sizing: border-box; font-size: 16px; line-height: 1.4">Five villages on the Ligurian coast, walked village to village.</span>

            <input placeholder="https://" aria-label="Link" style="all: unset; flex-grow: 1; font-size: 16px">
          </span>
        </label>
      </section>

      <section style="border-radius: 24px; background: #1B2122; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 38%">Dates</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="position: relative; display: block">
            <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #1B2122; font-size: 12px; font-weight: 600; color: #BFC8CA">Start</span>
            <span style="height: 56px; border-radius: 14px; border: 1px solid #899294; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#BFC8CA" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <input value="05/09/2026" aria-label="Start date" style="all: unset; flex-grow: 1; min-width: 0; font-size: 15px">
            </span>
          </label>
          <label style="position: relative; display: block">
            <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #1B2122; font-size: 12px; font-weight: 600; color: #BFC8CA">End</span>
            <span style="height: 56px; border-radius: 14px; border: 1px solid #899294; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#BFC8CA" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <input value="09/09/2026" aria-label="End date" style="all: unset; flex-grow: 1; min-width: 0; font-size: 15px">
            </span>
          </label>
        </div>
        <label style="display: flex; align-items: center; gap: 14px">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Public</span><span style="font-size: 13px; color: #BFC8CA">Anyone with the link can view it</span></span>
          <input type="checkbox" role="switch" aria-label="Public" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span aria-hidden="true" style="width: 52px; height: 32px; border-radius: 16px; background: #303637; border: 2px solid #899294; box-sizing: border-box; display: flex; align-items: center; padding-left: 6px"><span style="width: 16px; height: 16px; border-radius: 8px; background: #899294"></span></span>
        </label>
      </section>
    </form>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #0E1415; border-top: 1px solid #3F484A; display: flex; flex-direction: column; gap: 4px">
    <button type="submit" style="all: unset; height: 56px; border-radius: 28px; background: #81D3E0; color: #00363C; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">Save changes</button>

  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { dark: dark, light: !dark };
  }
}
</script>
</body>
</html>
