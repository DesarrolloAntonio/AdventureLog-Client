<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AdventureLog iOS new lodging</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007A85}a:hover{color:#005A62}
.glass-bar{background:rgba(250,250,252,0.6);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:0.5px solid rgba(255,255,255,0.85);box-shadow:inset 0 1px 0.5px rgba(255,255,255,0.95),0 6px 18px rgba(0,0,0,0.1)}
.glass-bar-d{background:rgba(36,36,40,0.6);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:0.5px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0.5px rgba(255,255,255,0.22),0 6px 18px rgba(0,0,0,0.1)}
</style>
</helmet>
<sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C1C1E; color: #000000; font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 46px; height: 40px; border-radius: 16px; background: #5A5A5E"></div>

  <div style="position: absolute; left: 0; right: 0; top: 58px; bottom: 0; background: #F2F2F7; border-radius: 38px 38px 0 0; overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 14px 16px 0; display: flex; align-items: center">
      <button class="glass-bar" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <span style="flex-grow: 1; text-align: center; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">New Lodging</span><span style="font-size: 12px; color: #636366">Cinque Terre</span></span>
      <button aria-label="Save" style="all: unset; width: 44px; height: 44px; border-radius: 22px; background: #007A85; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0.5px rgba(255,255,255,0.45), 0 6px 14px rgba(0,122,133,0.3); cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></button>
    </div>

    <form style="padding: 18px 16px 0; display: flex; flex-direction: column">
      <div role="radiogroup" aria-label="Type" style="display: flex; gap: 8px; margin-right: -16px; overflow: hidden; white-space: nowrap; margin-bottom: 14px">
        <button role="radio" aria-checked="true" style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #1C1C1E; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center">Hotel</button>
        <button role="radio" aria-checked="false" style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 15px; display: flex; align-items: center">Apartment</button>
        <button role="radio" aria-checked="false" style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 15px; display: flex; align-items: center">B&amp;B</button>
        <button role="radio" aria-checked="false" style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 15px; display: flex; align-items: center">Hostel</button>
        <button role="radio" aria-checked="false" style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 15px; display: flex; align-items: center">Campground</button>
      </div>

      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <label style="height: 52px; padding: 0 16px; display: flex; align-items: center; border-bottom: 0.5px solid #D1D1D6"><input placeholder="Name" aria-label="Name" style="all: unset; flex-grow: 1; font-size: 17px"></label>
        <label style="height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 10px">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
          <input placeholder="Where it is" aria-label="Where it is" style="all: unset; flex-grow: 1; font-size: 17px">
        </label>
      </div>

      <div style="margin: 22px 4px 6px; font-size: 13px; font-weight: 600; color: #636366">THE STAY</div>
      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 0.5px solid #D1D1D6; font-size: 17px">Check-in<span style="flex-grow: 1"></span><span style="display: flex; gap: 6px"><span style="height: 34px; padding: 0 10px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center">5 Sep 2026</span><span style="height: 34px; padding: 0 10px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center">15:00</span></span></div>
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 0.5px solid #D1D1D6; font-size: 17px">Check-out<span style="flex-grow: 1"></span><span style="display: flex; gap: 6px"><span style="height: 34px; padding: 0 10px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center">9 Sep 2026</span><span style="height: 34px; padding: 0 10px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center">11:00</span></span></div>
        <label style="height: 52px; display: flex; align-items: center; padding: 0 16px; border-bottom: 0.5px solid #D1D1D6; font-size: 17px">Reservation<input placeholder="Booking code" aria-label="Reservation" style="all: unset; flex-grow: 1; text-align: right; font-size: 17px"></label>
        <label style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 17px">Price<input placeholder="0.00" aria-label="Price" style="all: unset; flex-grow: 1; text-align: right; font-size: 17px"><span style="color: #636366">EUR</span></label>
      </div>

      <div style="margin: 22px 4px 6px; font-size: 13px; font-weight: 600; color: #636366">MORE</div>
      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <label style="height: 52px; padding: 0 16px; display: flex; align-items: center; border-bottom: 0.5px solid #D1D1D6"><input placeholder="Booking link" aria-label="Booking link" style="all: unset; flex-grow: 1; font-size: 17px"></label>
        <label style="height: 52px; padding: 0 16px; display: flex; align-items: center"><input placeholder="Notes" aria-label="Notes" style="all: unset; flex-grow: 1; font-size: 17px"></label>
      </div>
    </form>
  </div>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { dark: dark, light: !dark };
  }
}
</script>
