<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AdventureLog Android new place</title>

</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006973}a:hover{color:#004F57}
</style>
</helmet>
<sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #F5FAFB; color: #171D1E; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; box-sizing: border-box">

  <div style="padding: 40px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; height: 48px">
      <button aria-label="Close" style="all: unset; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#171D1E" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <h1 style="margin: 4px 4px 0; font-size: 52px; line-height: 1; font-weight: 800; font-stretch: 38%; letter-spacing: -0.5px">New place</h1>

    <form style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px">
      <section style="border-radius: 24px; background: #FFFFFF; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 38%">Basic information</h2>
        <label style="position: relative; display: block">
          <span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #006973">Name of the place</span>
          <span style="height: 56px; border-radius: 14px; border: 2px solid #006973; display: flex; align-items: center; padding: 0 14px; box-sizing: border-box"><input value="Hallstatt" aria-label="Name of the place" style="all: unset; flex-grow: 1; font-size: 16px"></span>
        </label>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 600; color: #3F484A">Category</span>
          <div role="radiogroup" aria-label="Category" style="display: flex; gap: 8px; flex-wrap: wrap">
            <button role="radio" aria-checked="true" style="all: unset; height: 36px; padding: 0 14px 0 10px; border-radius: 10px; background: #CDE7EC; color: #334B4F; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="#334B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>General
            </button>
            <button role="radio" aria-checked="false" style="all: unset; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #BFC8CA; color: #3F484A; font-size: 14px; font-weight: 600; display: flex; align-items: center; box-sizing: border-box">Hiking</button>
            <button style="all: unset; height: 36px; padding: 0 14px; border-radius: 10px; border: 1.5px dashed #6F797A; color: #3F484A; font-size: 14px; font-weight: 600; display: flex; align-items: center; box-sizing: border-box">+ Category</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-size: 13px; font-weight: 600; color: #3F484A; flex-grow: 1">Rating</span>
          <span role="radiogroup" aria-label="Rating, 4 of 5" style="display: flex; gap: 2px">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="#006973"/></svg>
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="#006973"/></svg>
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="#006973"/></svg>
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="#006973"/></svg>
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="none" stroke="#6F797A" stroke-width="1.6"/></svg>
          </span>
        </div>
        <button type="button" style="all: unset; height: 88px; border-radius: 16px; border: 1.5px dashed #6F797A; display: flex; align-items: center; justify-content: center; gap: 8px; color: #3F484A; font-size: 15px; font-weight: 700; box-sizing: border-box">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="#3F484A" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>
          Add photo
        </button>
      </section>

      <section style="border-radius: 24px; background: #FFFFFF; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 38%">Where it is</h2>
        <label style="height: 52px; border-radius: 26px; background: #E3E9EA; display: flex; align-items: center; gap: 10px; padding: 0 16px">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#3F484A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
          <input value="Hallstatt, Upper Austria" aria-label="Search the map" style="all: unset; flex-grow: 1; font-size: 16px">
        </label>
        <svg viewBox="0 0 348 120" width="100%" height="120" role="img" aria-label="Map preview with the place pinned" style="border-radius: 16px; display: block">
          <rect width="348" height="120" fill="#EEF2EC"/>
          <path d="M150 0 C140 40 170 70 150 120 H210 C230 80 200 40 220 0Z" fill="#A8D3DE"/>
          <path d="M0 80 C80 60 140 90 348 70" fill="none" stroke="#FFFFFF" stroke-width="4"/>
          <circle cx="174" cy="56" r="14" fill="#006973" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M168 60 L172 53 L174 57 L176 54 L180 60Z" fill="#FFFFFF"/>
        </svg>
      </section>
    </form>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #F5FAFB; border-top: 1px solid #DEE3E4; display: flex; flex-direction: column; gap: 4px">
    <button type="submit" style="all: unset; height: 56px; border-radius: 28px; background: #006973; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">Save place</button>
    <button type="button" style="all: unset; height: 48px; border-radius: 24px; color: #006973; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">Cancel</button>
  </div>
</div>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>

  renderVals() {
    const dark = this.props.dark ?? false;
    return { dark: dark, light: !dark };
