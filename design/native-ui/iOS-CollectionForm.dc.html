<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AdventureLog iOS edit collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007A85}a:hover{color:#005A62}
.glass-bar{background:rgba(250,250,252,0.6);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:0.5px solid rgba(255,255,255,0.85);box-shadow:inset 0 1px 0.5px rgba(255,255,255,0.95),0 6px 18px rgba(0,0,0,0.1)}
.glass-bar-d{background:rgba(36,36,40,0.6);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:0.5px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0.5px rgba(255,255,255,0.22),0 6px 18px rgba(0,0,0,0.1)}
</style>
</helmet>
<sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C1C1E; color: #000000; font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 46px; height: 40px; border-radius: 16px; background: #5A5A5E"></div>

  <div style="position: absolute; left: 0; right: 0; top: 58px; bottom: 0; background: #F2F2F7; border-radius: 38px 38px 0 0; overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 14px 16px 0; display: flex; align-items: center">
      <button class="glass-bar" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <span style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Edit Collection</span>
      <button aria-label="Save" style="all: unset; width: 44px; height: 44px; border-radius: 22px; background: #007A85; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0.5px rgba(255,255,255,0.45), 0 6px 14px rgba(0,122,133,0.3); cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></button>
    </div>

    <form style="padding: 18px 16px 0; display: flex; flex-direction: column">
      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <label style="padding: 12px 16px; border-bottom: 0.5px solid #D1D1D6; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #636366">Name</span>
          <input value="Cinque Terre" aria-label="Name" style="all: unset; font-family: ui-serif, 'New York', Georgia, serif; font-size: 24px; font-weight: 700">
        </label>
        <label style="padding: 12px 16px; border-bottom: 0.5px solid #D1D1D6; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #636366">Description</span>
          <span style="font-size: 17px; line-height: 23px">Five villages on the Ligurian coast, walked village to village.</span>
        </label>
        <label style="height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 10px">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          <input placeholder="Link" aria-label="Link" style="all: unset; flex-grow: 1; font-size: 17px">
        </label>
      </div>

      <div style="margin: 22px 4px 6px; font-size: 13px; font-weight: 600; color: #636366">DATES</div>
      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: #FF3B30; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <span style="flex-grow: 1; height: 56px; display: flex; align-items: center; border-bottom: 0.5px solid #D1D1D6; font-size: 17px">Starts<span style="flex-grow: 1"></span><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center; font-size: 17px">5 Sep 2026</span></span>
        </div>
        <div style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: #FF3B30; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <span style="flex-grow: 1; font-size: 17px; display: flex; align-items: center">Ends<span style="flex-grow: 1"></span><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: rgba(118,118,128,0.12); display: flex; align-items: center; font-size: 17px; color: #007A85">9 Sep 2026</span></span>
        </div>
      </div>

      <div style="margin: 22px 4px 6px; font-size: 13px; font-weight: 600; color: #636366">SHARING</div>
      <div style="border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
        <label style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: #007AFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></span>
          <span style="flex-grow: 1; font-size: 17px">Public</span>
          <input type="checkbox" role="switch" aria-label="Public" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span aria-hidden="true" style="width: 62px; height: 28px; border-radius: 14px; background: rgba(120,120,128,0.16); display: flex; align-items: center; padding: 2px; box-sizing: border-box"><span style="width: 38px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.2)"></span></span>
        </label>
      </div>
      <p style="margin: 8px 16px 0; font-size: 13px; line-height: 18px; color: #636366">A public collection can be viewed by anyone with its link.</p>
    </form>
  </div>
</div>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { dark: dark, light: !dark };
  }
}
</script>
