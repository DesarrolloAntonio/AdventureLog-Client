#Gradle
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8G"
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Compose
org.jetbrains.compose.experimental.wasm.enabled=true

#App version - kept here rather than in build.gradle.kts so the release workflow can read it
#with grep and tag the release after it, instead of stamping a timestamp nobody can match to a build.
versionCode=8
versionName=0.0.8-alpha

#AGP 9 dropped support for com.android.application/library alongside the Kotlin
#Multiplatform plugin, recommending com.android.kotlin.multiplatform.library instead -
#which is a library-only plugin, so it cannot replace com.android.application here.
#These two flags keep the previous behaviour while that migration is evaluated separately.
android.builtInKotlin=false
android.newDsl=false
